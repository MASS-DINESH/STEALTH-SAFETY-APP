name: safety_app
description: Personal Safety — triple volume-up panic button app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^13.0.1
  geolocator: ^14.0.3
  camera: ^0.12.0+2
  flutter_sound:                ^9.6.0
  flutter_background_service:   ^5.0.10
  battery_plus: ^7.1.1
  http:                         ^1.2.2
  path_provider:                ^2.1.4
  shared_preferences:           ^2.3.2
  url_launcher:                 ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D0B2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
